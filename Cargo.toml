[package]
name = "cbmman"
version = "0.1.0"
edition = "2021"
description = "Interactive TUI manager for codebase-memory-mcp: index, query, and monitor codebase knowledge graphs from the terminal."
license = "MIT"
readme = "README.md"
repository = "https://github.com/handyutils/cbmman"
homepage = "https://github.com/handyutils/cbmman"
documentation = "https://github.com/handyutils/cbmman"
keywords = ["tui", "mcp", "knowledge-graph", "codebase", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
include = ["cbmman.rs", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "cbmman"
path = "cbmman.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
