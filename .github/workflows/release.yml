name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: macOS Intel
            os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: deb
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: deb
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/cbmman dist/cbmman
          tar -C dist -czf cbmman-${{ matrix.target }}.tar.gz cbmman
      - name: Package Debian package
        if: matrix.archive == 'deb'
        shell: bash
        run: |
          mkdir -p dist/cbmman-${{ matrix.target }}/usr/bin
          cp target/${{ matrix.target }}/release/cbmman dist/cbmman-${{ matrix.target }}/usr/bin/cbmman
          mkdir -p dist/cbmman-${{ matrix.target }}/DEBIAN
          cat > dist/cbmman-${{ matrix.target }}/DEBIAN/control <<'EOF'
Package: cbmman
Version: ${{ github.ref_name }}
Section: utils
Priority: optional
Architecture: ${{ matrix.deb_arch }}
Depends: libc6
Maintainer: handyutils
Description: cbmman - Interactive TUI manager for codebase-memory-mcp
EOF
          dpkg-deb --build dist/cbmman-${{ matrix.target }} cbmman-${{ matrix.target }}.deb
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/${{ matrix.target }}/release/cbmman.exe dist/cbmman.exe
          Compress-Archive -Path dist/cbmman.exe -DestinationPath cbmman-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cbmman-${{ matrix.target }}
          path: cbmman-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create checksums
        shell: bash
        run: |
          mkdir release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \) -exec cp {} release/ \;
          cd release
          sha256sum cbmman-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --repo "${{ github.repository }}" --generate-notes --verify-tag
