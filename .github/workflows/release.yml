name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.5)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: macOS Intel
            os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: deb
            deb_arch: amd64
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: deb
            deb_arch: arm64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - name: Install cross-compiler for ARM64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/cbmman dist/cbmman
          tar -C dist -czf cbmman-${{ matrix.target }}.tar.gz cbmman
      - name: Package Debian package
        if: matrix.archive == 'deb'
        shell: bash
        run: |
          mkdir -p dist/cbmman-${{ matrix.target }}/usr/bin
          cp target/${{ matrix.target }}/release/cbmman dist/cbmman-${{ matrix.target }}/usr/bin/cbmman
          mkdir -p dist/cbmman-${{ matrix.target }}/DEBIAN
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          printf '%s\n' \
            "Package: cbmman" \
            "Version: $VERSION" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: ${{ matrix.deb_arch }}" \
            "Depends: libc6" \
            "Maintainer: handyutils" \
            "Description: cbmman - Interactive TUI manager for codebase-memory-mcp" \
            > dist/cbmman-${{ matrix.target }}/DEBIAN/control
          dpkg-deb --build dist/cbmman-${{ matrix.target }} cbmman-${{ matrix.target }}.deb
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/${{ matrix.target }}/release/cbmman.exe dist/cbmman.exe
          Compress-Archive -Path dist/cbmman.exe -DestinationPath cbmman-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cbmman-${{ matrix.target }}
          path: cbmman-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create checksums
        shell: bash
        run: |
          mkdir release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \) -exec cp {} release/ \;
          cd release
          sha256sum cbmman-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.version && 'v' + github.event.inputs.version || github.ref_name }}
        run: gh release create "${RELEASE_TAG}" release/* --repo "${{ github.repository }}" --generate-notes --verify-tag
